services:
  - type: web
    name: land-registry-backend
    runtime: node
    plan: free
    rootDir: land-registry-backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DB_POOL_MAX
        value: "5"
      - key: DOCUMENT_STORAGE_DRIVER
        value: s3
      - key: SMTP_PORT
        value: "2525"
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # Set these for S3-compatible providers such as Cloudflare R2.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_FORCE_PATH_STYLE
        sync: false
      - key: AWS_REGION
        sync: false
