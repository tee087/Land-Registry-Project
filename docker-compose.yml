services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-land_registry_chain}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-p${MYSQL_ROOT_PASSWORD:-root}']
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: ./land-registry-backend
    command: npm run db:migrate
    environment: &backend_env
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-land_registry_chain}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-production-secret-at-least-32-chars}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build: ./land-registry-backend
    environment:
      <<: *backend_env
      PORT: 5000
      UPLOAD_DIR: /app/uploads
      BLOCKCHAIN_RPC_URL: ${BLOCKCHAIN_RPC_URL:-}
      BLOCKCHAIN_CONTRACT_ADDRESS: ${BLOCKCHAIN_CONTRACT_ADDRESS:-}
      BLOCKCHAIN_PRIVATE_KEY: ${BLOCKCHAIN_PRIVATE_KEY:-}
    ports:
      - '5000:5000'
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./land-registry-frotend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads:
